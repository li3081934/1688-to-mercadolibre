<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1688 Product Collector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <section class="hero">
        <p class="eyebrow">1688 Product Pack</p>
        <h1>采集当前商品</h1>
        <p class="subtitle">导出主商品、SKU、SKU 图片、商品属性、包装信息、详情内容和详情图片。</p>
      </section>

      <section class="status-card">
        <p class="status-label">当前状态</p>
        <p id="statusText" class="status-text">等待采集</p>
      </section>

      <div class="button-group">
        <button id="collectButton" class="collect-button" type="button">采集并下载商品包</button>
        <button id="uploadButton" class="upload-button" type="button">采集并上传到系统建档</button>
      </div>

      <section class="server-config">
        <label for="serverUrl">系统服务地址</label>
        <div class="server-input-row">
          <input id="serverUrl" class="server-url-input" type="url" placeholder="http://localhost:3000" />
          <button id="saveUrlButton" class="save-url-button" type="button">保存</button>
        </div>
      </section>

      <section class="sku-limit-config">
        <label for="skuPromptLimit">SKU 采集提示上限</label>
        <div class="sku-limit-row">
          <input id="skuPromptLimit" class="sku-limit-input" type="number" min="1" step="1" value="10" />
          <span>个</span>
        </div>
        <p>SKU 数量超过此上限时，采集前选择需要的 SKU。</p>
      </section>

      <section class="result-card">
        <div class="result-row">
          <span>标题</span>
          <strong id="titleText">-</strong>
        </div>
        <div class="result-row">
          <span>SKU 数量</span>
          <strong id="filledCountText">0</strong>
        </div>
        <div class="result-row">
          <span>总图片数</span>
          <strong id="imageCountText">0</strong>
        </div>
      </section>
    </main>

    <div id="skuPicker" class="modal-backdrop" hidden>
      <section class="sku-picker" role="dialog" aria-modal="true" aria-labelledby="skuPickerTitle">
        <div class="sku-picker-header">
          <div>
            <p class="eyebrow">SKU Selection</p>
            <h2 id="skuPickerTitle">选择要采集的 SKU</h2>
            <p id="skuPickerSummary" class="sku-picker-summary"></p>
          </div>
          <button id="skuPickerClose" class="icon-button" type="button" aria-label="取消">×</button>
        </div>
        <div class="sku-picker-toolbar">
          <button id="selectAllSkusButton" class="select-all-button" type="button">全选</button>
          <span id="selectedSkuCount" class="selected-sku-count"></span>
        </div>
        <div id="skuList" class="sku-list"></div>
        <div class="sku-picker-actions">
          <button id="cancelSkuButton" class="modal-secondary-button" type="button">取消采集</button>
          <button id="confirmSkuButton" class="modal-primary-button" type="button">采集选中的 SKU</button>
        </div>
      </section>
    </div>

    <script src="vendor/jszip.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
